name: Publish GitHub Pages demonstration
on:
  push:
    branches: [main]
    paths: ['apps/frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run build
        working-directory: apps/frontend
        env:
          VITE_DEMO_MODE: 'true'
      - run: node --test scripts/test-pwa.mjs scripts/test-sounds.mjs
        working-directory: apps/frontend
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
