name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade "setuptools>=84.1"
      - run: pip install -e './apps/backend[test]'
      - run: pytest
        working-directory: apps/backend
        env:
          DATABASE_URL: sqlite://
      - run: pip install pip-audit && pip-audit
